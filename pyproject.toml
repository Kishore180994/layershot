[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layershot"
version = "0.3.3"
description = "Let AI agents see, open, click and type in Windows apps behind the one you are using - without taking over your screen. CLI + MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "Pillow>=9", "comtypes>=1.2"]
keywords = ["mcp", "screenshot", "windows", "claude", "agents", "computer-use", "ui-automation", "background"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.urls]
Homepage = "https://github.com/Kishore180994/layershot"
Documentation = "https://github.com/Kishore180994/layershot/blob/master/docs/HOW-IT-WORKS.md"
Issues = "https://github.com/Kishore180994/layershot/issues"

[project.scripts]
layershot = "layershot.cli:main"
layershot-mcp = "layershot.server:main"
